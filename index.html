function intro(){const l=L[S.lvl];if(!S.own.includes(S.lvl+'-'+(S.sel[S.lvl]??-1)))return wardrobe();

function start(){ui.style.display='none';mode='play';hud.hidden=false;P={x:W/2,y:H-90};tx=P.x;ty=P.y;items=[];got=0;runScore=0;combo=0;comboTimer=0;popups=[];sparks=[];shake=0;reverseGravity=false;shiftAvailableAt=0;shiftPulse=0;shiftField=0;shiftChargePct=-1;const pk=cur().perk;lives=pk==='life'?4:3;t=0;shiftButton.style.display=S.lvl===0?'block':'none';updateShiftButton()}
function updateShiftButton(){const direction=shiftField>0?'FIELD ACTIVE':`GRAVITY ${reverseGravity?'UP':'DOWN'}`;if(shiftHint.textContent!==direction)shiftHint.textContent=direction;shiftButton.classList.toggle('reverse',reverseGravity);const remaining=Math.max(0,shiftAvailableAt-performance.now()),ready=remaining===0,label=ready?'SHIFT · READY':'SHIFT';const chargePct=Math.floor(100*(1-remaining/3200));if(chargePct!==shiftChargePct){shiftChargePct=chargePct;shiftCharge.style.transform=`scaleX(${chargePct/100})`}if(shiftButton.querySelector('span').textContent!==label)shiftButton.querySelector('span').textContent=label;const shouldDisable=!ready;if(shiftButton.disabled!==shouldDisable)shiftButton.disabled=shouldDisable;const aria=ready?'Shift gravity and pull in nearby cores':'Gravity shift recharging';if(shiftButton.getAttribute('aria-label')!==aria)shiftButton.setAttribute('aria-label',aria)}
function shiftGravity(){const now=performance.now();if(mode!=='play'||S.lvl!==0||now<shiftAvailableAt)return;reverseGravity=!reverseGravity;shiftAvailableAt=now+3200;shiftPulse=.55;shiftField=1.15;shake=.12;for(const item of items)item.dir*=-1;updateShiftButton()}
shiftButton.addEventListener('pointerdown',e=>{e.preventDefault();shiftGravity()});
window.addEventListener('keydown',e=>{if((e.key==='Shift'||e.key.toLowerCase()==='x')&&!e.repeat){e.preventDefault();shiftGravity()}});
function after(){const l=L[S.lvl];show(`<p class="eyebrow">Core secured · Run score ${runScore}</p><h1>One last signal</h1><p>${l.puz==='simon'?'Repeat the signal sequence to stabilize the core.':'Match the signal pairs to stabilize the core.'}</p><button onclick="${l.puz}()">Take the puzzle</button>`)}
function updatePuzzleClock(){
 if(!puzzleState)return;
 let text=puzzleState.detail;
 if(puzzleState.deadline){const seconds=Math.max(0,Math.ceil((puzzleState.deadline-performance.now())/1000));text+=` · ${seconds}s`;if(seconds===0){puzzleState.onTimeout();return}}
 const meta=document.getElementById('puzzleMeta');
 if(meta&&meta.textContent!==text)meta.textContent=text;
}
function beginPuzzle({detail,seconds=0,onTimeout}){
 mode='puzzle';
 puzzleState={detail,deadline:seconds?performance.now()+seconds*1000:0,onTimeout:onTimeout||(()=>{})};
 updatePuzzleClock();
 return puzzleToken;
}
function puzzleFailed(reason){
 const retry=L[S.lvl].puz;
 mode='puzzle-failed';
 show(`<p class="eyebrow">Core signal lost</p><h1>${reason}</h1><p>The run score is safe. Reset the puzzle and try again.</p><button onclick="${retry}()">Retry puzzle</button>`);
}
function simon(){
 const cols=['#ef4444','#22c55e','#3b82f6','#eab308'],marks=['●','◆','▲','■'],difficulty={0:{length:5,beat:560},2:{length:7,beat:470},4:{length:9,beat:390}}[S.lvl]||{length:5,beat:520};
 const {length:n,beat}=difficulty,seq=Array.from({length:n},()=>Math.floor(Math.random()*4)),maxMistakes=3;let u=0,ready=false,mistakes=0;
 show(`<p class="eyebrow">Core puzzle · Memory test</p><h1>Repeat the signal</h1><p class="puzzle-meta" id="puzzleMeta"></p><p class="puzzle-note" id="m">Watch the full sequence.</p><div class="grid" style="grid-template-columns:64px 64px">${cols.map((c,i)=>`<button class="pad" id="b${i}" style="background:${c}" aria-label="Signal ${i+1}" onclick="pp(${i})">${marks[i]}</button>`).join('')}</div>`);
 const token=beginPuzzle({detail:`${n} signals · ${maxMistakes} misses`,onTimeout:()=>{}});
 const flash=(i)=>{const b=document.getElementById('b'+i);if(!b)return;b.classList.add('lit');schedulePuzzle(()=>b.classList.remove('lit'),Math.min(260,beat*.58),token)};
 function play(){
  if(token!==puzzleToken)return;u=0;ready=false;
  const note=document.getElementById('m');if(note)note.textContent=mistakes?`Miss ${mistakes}/${maxMistakes} · watch again`:'Watch the full sequence.';
  seq.forEach((signal,k)=>schedulePuzzle(()=>flash(signal),450+k*beat,token));
  schedulePuzzle(()=>{ready=true;const status=document.getElementById('m');if(status)status.textContent=`Your turn · 0/${n}`},450+n*beat,token);
 }
 window.pp=i=>{
  if(!ready||token!==puzzleToken)return;
  flash(i);
  if(i!==seq[u]){
   ready=false;mistakes++;const note=document.getElementById('m');
   if(mistakes>=maxMistakes){puzzleFailed('Three strikes');return}
   if(note)note.textContent=`Wrong signal · ${maxMistakes-mistakes} misses left`;
   schedulePuzzle(play,750,token);return;
  }
  u++;const note=document.getElementById('m');if(note)note.textContent=`Your turn · ${u}/${n}`;
  if(u===n){ready=false;fin(30)}
 };
 play();
}
function match(){
 const settings=S.lvl===1?{pairs:6,seconds:50,misses:3}:{pairs:8,seconds:42,misses:2};
 const marks=['●','◆','▲','■','✚','⬟','✦','⬢'],deck=[...marks.slice(0,settings.pairs),...marks.slice(0,settings.pairs)].sort(()=>Math.random()-.5);
 let first=null,locked=false,found=0,misses=0;
 show(`<p class="eyebrow">Core puzzle · Recall test</p><h1>Find every pair</h1><p class="puzzle-meta" id="puzzleMeta"></p><p class="puzzle-note" id="m">Study the layout. The clock starts when the cards turn.</p><div class="grid puzzle-grid">${deck.map((mark,i)=>`<button class="card face preview" id="k${i}" aria-label="Preview card ${mark}" onclick="fl(${i})">${mark}</button>`).join('')}</div>`);
 const token=beginPuzzle({detail:`${settings.pairs} pairs · ${settings.misses} misses`,onTimeout:()=>puzzleFailed('Time expired')});
 locked=true;
 schedulePuzzle(()=>{for(const card of document.querySelectorAll('.card.preview')){card.textContent='?';card.classList.remove('face','preview');card.setAttribute('aria-label',`Hidden card ${Number(card.id.slice(1))+1}`)}locked=false;const note=document.getElementById('m');if(note)note.textContent='Cards are down. Find the pairs.';puzzleState.deadline=performance.now()+settings.seconds*1000;updatePuzzleClock()},1900,token);
 window.fl=i=>{
  if(locked||token!==puzzleToken)return;
  const card=document.getElementById('k'+i);if(!card||card.dataset.matched||card===first)return;
  card.textContent=deck[i];card.classList.add('face');card.setAttribute('aria-label',`Card ${deck[i]}`);card.dataset.open='true';
  if(!first){first=card;return}
  const prior=first,priorIndex=Number(prior.id.slice(1));first=null;
  if(deck[priorIndex]===deck[i]){
   card.dataset.matched=prior.dataset.matched='true';card.classList.remove('face');prior.classList.remove('face');card.classList.add('matched');prior.classList.add('matched');
   found++;const note=document.getElementById('m');if(note)note.textContent=`Pairs found · ${found}/${settings.pairs}`;
   if(found===settings.pairs){locked=true; schedulePuzzle(()=>fin(30),400,token)}
   return;
  }
  misses++;const note=document.getElementById('m');if(note)note.textContent=`Mismatch · ${settings.misses-misses} misses left`;
  locked=true;
  if(misses>=settings.misses){schedulePuzzle(()=>puzzleFailed('Too many mismatches'),550,token);return}
  schedulePuzzle(()=>{card.textContent=prior.textContent='?';card.classList.remove('face');prior.classList.remove('face');card.removeAttribute('data-open');prior.removeAttribute('data-open');card.setAttribute('aria-label',`Hidden card ${i+1}`);prior.setAttribute('aria-label',`Hidden card ${priorIndex+1}`);locked=false},700,token);
 };
}
function fin(bonus){mode='menu';const m=cur().perk==='bonus'?1.5:1,pts=Math.round((runScore+bonus)*m);S.w+=pts;
 if(S.lvl<4){S.lvl++;save();show(`<p class="eyebrow">Timeline restored · +${pts} points</p><h1>${L[S.lvl].n}</h1><p>The core is stable. A new signal is coming from the next age.</p><p>Run score ${runScore} · Puzzle ${bonus}${m>1?' · Suit bonus applied':''}</p><button onclick="wardrobe()">Prepare for the next age</button>`)}
 else{save();show(`<p class="eyebrow">The timeline holds</p><h1>Journey complete</h1><p>You recovered every core and carried the timeline from deep space to the colony.</p><p>Final balance · ${S.w} points</p><button onclick="reset()">Start a new run</button>`)}}
function over(){mode='end';show(`<p class="eyebrow">Signal lost</p><h1>Run ended</h1><p>Your score was ${runScore}. The core is still out there.</p><button onclick="start()">Try again</button><button class="s" onclick="wardrobe()">Return to field gear</button>`)}
function pos(e){const r=cv.getBoundingClientRect(),touchOffset=e.pointerType==='touch'?50:0;tx=Math.max(25,Math.min(W-25,(e.clientX-r.left)/r.width*W));ty=Math.max(70,Math.min(H-40,(e.clientY-r.top)/r.height*H-touchOffset))}
cv.addEventListener('pointermove',pos);cv.addEventListener('pointerdown',pos);
function loop(){
 requestAnimationFrame(loop);T++;
 const l=L[S.lvl],gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,l.sky[0]);gr.addColorStop(1,l.sky[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);bg(S.lvl);
 g.globalAlpha=.65;g.fillStyle=S.lvl===2||S.lvl===3?'#fff':'#c7e9ef';
 for(const s of parts){s.y+=s.s*(S.lvl===1?-.5:.6);if(s.y>H||s.y<0){s.y=S.lvl===1?H:0;s.x=Math.random()*W}g.fillRect(s.x,s.y,s.s*1.5,s.s*1.5)}
 g.globalAlpha=1;if(S.lvl===1)lavaFloor();if(mode==='puzzle'){updatePuzzleClock();return}if(mode!=='play')return;

 t++;shiftPulse=Math.max(0,shiftPulse-1/60);shiftField=Math.max(0,shiftField-1/60);
 if(comboTimer>0){comboTimer=Math.max(0,comboTimer-1/60);if(comboTimer===0)combo=0}
 const pad=navigator.getGamepads?.()[0],pressed=!!pad?.buttons?.[0]?.pressed;
 if(pressed&&!gamepadShiftDown)shiftGravity();gamepadShiftDown=pressed;
 updateShiftButton();
 if(t%Math.max(16,46-S.lvl*4)===0){
  const bad=Math.random()<.35+S.lvl*.04,a=bad?l.bad:l.good,dir=reverseGravity?-1:1;
  items.push({x:25+Math.random()*(W-50),y:dir<0?H+20:-20,e:a[Math.random()*a.length|0],bad,v:1.7+S.lvl*.4+Math.random(),dir});
 }
 P.x+=(tx-P.x)*.22;P.y+=(ty-P.y)*.22;
 const R=cur().perk==='magnet'?58:36,shakeX=shake>0?(Math.random()-.5)*shake*30:0,shakeY=shake>0?(Math.random()-.5)*shake*30:0;
 shake=Math.max(0,shake-.018);g.save();g.translate(shakeX,shakeY);
 if(S.lvl===0&&shiftField>0){g.save();g.globalAlpha=shiftField*.48;g.strokeStyle='#9df4e8';g.lineWidth=2;g.beginPath();g.arc(P.x,P.y,44+(1.15-shiftField)*74,0,Math.PI*2);g.stroke();g.restore()}
 let cleared=false;
 for(let i=items.length-1;i>=0;i--){
  const it=items[i];it.y+=it.v*it.dir;
  if(S.lvl===0&&shiftField>0&&!it.bad){it.x+=(P.x-it.x)*.075;it.y+=(P.y-it.y)*.045}
  const cx=it.x,cy=it.y-14,k=it.bad?'255,110,90':'145,240,220',rg=g.createRadialGradient(cx,cy,4,cx,cy,36);
  rg.addColorStop(0,`rgba(${k},.55)`);rg.addColorStop(1,`rgba(${k},0)`);g.fillStyle=rg;g.beginPath();g.arc(cx,cy,36,0,Math.PI*2);g.fill();
  if(S.lvl===0)drawSpaceItem(it);else{g.fillStyle=it.bad?'#ff765f':'#fff0a1';g.font='34px serif';g.textAlign='center';g.fillText(it.e,it.x,it.y)}
  if(Math.hypot(it.x-P.x,it.y-P.y)<R){
   items.splice(i,1);
   if(it.bad){lives--;combo=0;comboTimer=0;shake=.28;burst(it.x,it.y,'#ff765f',18);if(lives<=0){g.restore();over();return}}
   else{collectItem(it);if(got>=l.goal){mode='puz';cleared=true;break}}
  }else if(it.y>H+30||it.y<-30)items.splice(i,1);
 }
 if(cleared){g.restore();after();return}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.035;s.life-=1/60;if(s.life<=0){sparks.splice(i,1);continue}g.globalAlpha=Math.min(1,s.life/s.max);g.fillStyle=s.color;g.beginPath();g.arc(s.x,s.y,2.4*s.life,0,Math.PI*2);g.fill()}
 g.globalAlpha=1;
 for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y-=.7;p.life-=1/60;if(p.life<=0){popups.splice(i,1);continue}g.globalAlpha=Math.min(1,p.life*2);g.fillStyle='#e2fff9';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(p.text,p.x,p.y)}
 g.globalAlpha=1;g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(P.x,P.y+54,26,7,0,0,7);g.fill();
 drawChar(g,P.x,P.y+Math.sin(T*.12)*2,cur(),1.3+Math.sin(T*.12)*.025);
 if(shiftPulse>0){g.globalAlpha=shiftPulse*1.4;g.strokeStyle=reverseGravity?'#ffc18a':'#9df4e8';g.lineWidth=3;g.beginPath();g.arc(P.x,P.y,24+(0.55-shiftPulse)*160,0,Math.PI*2);g.stroke();g.globalAlpha=1}
 g.restore();
 const goal=`${got} / ${l.goal} CORES`,score=`SCORE ${String(runScore).padStart(3,'0')}${combo>1?` · x${combo}`:''}`,lifeText=`LIVES · ${lives}`;
 if(goalText.textContent!==goal)goalText.textContent=goal;if(scoreText.textContent!==score)scoreText.textContent=score;if(livesText.textContent!==lifeText)livesText.textContent=lifeText;
}
menu();loop();
</script></body></html>
